workflow = 'v1'

[airpot]
backend = 'none'

[cortado]
backend = 'blocking_mixmax'
block_relative_error = 0.0001
desc = true
num_blocks = 50000
pep_fdr_type = 'psm-precursor'
score_column = 'ClassifierScore'

[cortado.errprob_kwargs]
decoy_ratio = 1.0

[cortado.pi0_kwargs]
subset_size = 20000

[output]
backend = 'combined'
include_decoys = true
mode = 'overwrite'
qval_thresh = 1.0

[peptide_quant]
backend = 'basic'
intensity_column = 'TotalIntensityRaw'
sample_column = 'filename'

[peptide_quant.normalization]
backend = 'mediandense'
density_thresh = 0.8
qval_thresh = 0.01

[proffer]
fasta_uri = '/tmp/fake.fasta'
heuristic = 'nsp'
qvalue_threshold = 0.01
reannotate = true

[proffer.reannotate_kwargs]
decoy_accession_prefix = 'DECOY_'
decoy_sequence_column = 'PeptideStringWithModsDecoyOrigin'
reannotate_decoys = true

[protein_rollup]
backend = 'directlfq'
qvalue_threshold = 0.01

[protein_scoring]
assign_confidence = true
rollup_level = 'precursor'

[protein_scoring.confidence_kwargs]
desc = false
score_column = 'nsp'

[search]
backend = 'radiant'
config = '/tmp/fake.radiantConfig'
fasta = '/tmp/fake.fasta'
library = '/tmp/fake.tsv'
location = []
output_location = '/tmp/radiant-results/'
reuse_existing = false
scoring = 'nn'